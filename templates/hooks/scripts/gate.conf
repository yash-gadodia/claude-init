# Harness config, sourced by every .claude/scripts hook and every .githooks hook.
# /claude-init fills these from the detected stack; this is the one file to edit
# when the stack changes, so no hook ever hardcodes a command or a subset of checks.

# The project's whole gate, one command, run from CHECK_DIR (relative to the repo
# root). Point it at the runner the project already uses (`npm run check`,
# `make check`, `just check`), never at a hand-picked list of checks: a list drifts
# the day someone adds a check and nothing tells you.
CHECK_CMD="npm run typecheck && npm test"
CHECK_DIR="."

# Edits under these dirs, with these extensions, arm the Stop gate.
SOURCE_DIRS="src test tests scripts"
SOURCE_EXTS="ts tsx js jsx mjs cjs json sql"

# Generated or append-only files the pre-edit hook refuses to hand-edit.
GENERATED_REGEX='(package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lock|node_modules/|\.next/|dist/)'
APPEND_ONLY_REGEX=''

# A dependency that fails to resolve mid-install is not a code failure: reinstall
# once from the lockfile and re-run before believing it.
REINSTALL_REGEX="Cannot find module '(@[A-Za-z0-9]|[A-Za-z0-9])"
REINSTALL_CMD="npm ci"

# Failures that say the environment is down (database, docker), not that the code
# is wrong. The gate warns and lets the turn end instead of sending the session
# after a bug that does not exist. Empty = none.
ENV_FAILURE_REGEX='ECONNREFUSED'
ENV_FAILURE_HINT="A service the checks need is not running (database?). Start it, then finish the turn again."

# Schema sync after pull/checkout. Empty MIGRATE_CMD disables it.
MIGRATION_PATHS_REGEX='^(migrations|db/migrations|prisma)/'
MIGRATE_CMD=""

# Branch a push must be up to date with.
DEFAULT_BRANCH="main"
